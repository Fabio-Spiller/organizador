apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-notificacao
spec:
  replicas: 1
  selector:
    matchLabels: {app: ms-notificacao}
  template:
    metadata:
      labels: {app: ms-notificacao}
    spec:
      containers:
        - name: ms-notificacao
          image: fabiospiller/ms-notificacao:1.0.0
          ports: [{containerPort: 8000}]
          env:
            - {name: RABBITMQ_HOST, value: rabbitmq}
            - {name: RABBITMQ_PORT, value: "5672"}
            - name: RABBITMQ_USER
              valueFrom: {secretKeyRef: {name: rabbitmq-auth, key: username}}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: rabbitmq-auth, key: password}}
          readinessProbe:
            httpGet: {path: /notificacoes, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ms-notificacao
spec:
  selector: {app: ms-notificacao}
  ports: [{port: 8000, targetPort: 8000}]
