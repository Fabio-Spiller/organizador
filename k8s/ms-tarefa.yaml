apiVersion: v1
kind: Secret
metadata:
  name: mysql-tarefa-auth
type: Opaque
stringData:
  password: labtarefa123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-tarefa
spec:
  replicas: 1
  selector:
    matchLabels: {app: mysql-tarefa}
  template:
    metadata:
      labels: {app: mysql-tarefa}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - {name: MYSQL_DATABASE, value: tarefadb}
            - {name: MYSQL_USER, value: tarefauser}
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-tarefa-auth, key: password}}
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-tarefa-auth, key: password}}
          ports: [{containerPort: 3306}]
          readinessProbe:
            tcpSocket: {port: 3306}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-tarefa
spec:
  selector: {app: mysql-tarefa}
  ports: [{port: 3306, targetPort: 3306}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-tarefa
spec:
  replicas: 3
  selector:
    matchLabels: {app: ms-tarefa}
  template:
    metadata:
      labels: {app: ms-tarefa}
    spec:
      containers:
        - name: ms-tarefa
          image: lucasnunesdossantos/ms-tarefa:1.0.0
          ports: [{containerPort: 8081}]
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://mysql-tarefa:3306/tarefadb?createDatabaseIfNotExist=true"}
            - {name: SPRING_DATASOURCE_USERNAME, value: tarefauser}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql-tarefa-auth, key: password}}
            - {name: USUARIO_SERVICE_URL, value: "http://ms-usuario:8082"}
            - {name: SPRING_RABBITMQ_HOST, value: rabbitmq}
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom: {secretKeyRef: {name: rabbitmq-auth, key: username}}
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: rabbitmq-auth, key: password}}
          readinessProbe:
            tcpSocket: {port: 8081}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 640Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: ms-tarefa
spec:
  selector: {app: ms-tarefa}
  ports: [{port: 8081, targetPort: 8081}]