apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: organizador-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /usuarios
            pathType: Prefix
            backend:
              service:
                name: ms-usuario
                port: {number: 8082}
          - path: /tarefas
            pathType: Prefix
            backend:
              service:
                name: ms-tarefa
                port: {number: 8081}
          - path: /instance
            pathType: Prefix
            backend:
              service:
                name: ms-tarefa
                port: {number: 8081}
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: ms-tarefa
                port: {number: 8081}
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: ms-tarefa
                port: {number: 8081}
          - path: /notificacoes
            pathType: Prefix
            backend:
              service:
                name: ms-notificacao
                port: {number: 8000}
